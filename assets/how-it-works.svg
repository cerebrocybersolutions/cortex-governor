<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 640" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif">
  <defs>
    <linearGradient id="gate" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1c2230"/>
      <stop offset="1" stop-color="#11151f"/>
    </linearGradient>
    <linearGradient id="hdr" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#58a6ff"/>
      <stop offset="1" stop-color="#bc8cff"/>
    </linearGradient>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#8b949e"/>
    </marker>
    <marker id="arrG" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#3fb950"/>
    </marker>
    <marker id="arrY" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#d29922"/>
    </marker>
    <marker id="arrR" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#f85149"/>
    </marker>
  </defs>

  <rect width="960" height="640" rx="14" fill="#0d1117"/>

  <!-- title -->
  <text x="40" y="50" fill="#ffffff" font-size="26" font-weight="700">How Cortex works</text>
  <text x="40" y="76" fill="#8b949e" font-size="15">A deterministic gate between an autonomous agent and the money it can spend. No model approves money.</text>

  <!-- agent -->
  <rect x="40" y="110" width="200" height="92" rx="10" fill="#161b22" stroke="#30363d"/>
  <rect x="40" y="110" width="5" height="92" rx="2" fill="#bc8cff"/>
  <text x="60" y="140" fill="#ffffff" font-size="16" font-weight="700">Hermes agent</text>
  <text x="60" y="164" fill="#8b949e" font-size="13">proposes a spend</text>
  <text x="60" y="184" fill="#8b949e" font-size="13">merchant · amount · purpose</text>

  <!-- arrow agent -> gate -->
  <line x1="240" y1="156" x2="338" y2="156" stroke="#8b949e" stroke-width="2" marker-end="url(#arr)"/>

  <!-- gate -->
  <rect x="340" y="96" width="320" height="208" rx="12" fill="url(#gate)" stroke="#58a6ff" stroke-width="1.5"/>
  <text x="500" y="128" fill="#58a6ff" font-size="17" font-weight="700" text-anchor="middle">CORTEX POLICY GATE</text>
  <line x1="364" y1="142" x2="636" y2="142" stroke="#30363d"/>
  <text x="364" y="172" fill="#c9d1d9" font-size="14" font-weight="600">1 · validate</text>
  <text x="364" y="190" fill="#8b949e" font-size="12.5">amount + currency well-formed, or fail closed</text>
  <text x="364" y="222" fill="#c9d1d9" font-size="14" font-weight="600">2 · hard-deny</text>
  <text x="364" y="240" fill="#8b949e" font-size="12.5">hard-max · vendor · category · rate window</text>
  <text x="364" y="272" fill="#c9d1d9" font-size="14" font-weight="600">3 · soft-escalate</text>
  <text x="364" y="290" fill="#8b949e" font-size="12.5">per-txn cap · vendor allowlist · purpose</text>

  <!-- arrows gate -> outcomes -->
  <path d="M660,150 C710,150 720,150 760,150" fill="none" stroke="#3fb950" stroke-width="2.5" marker-end="url(#arrG)"/>
  <path d="M660,200 C710,200 720,228 760,228" fill="none" stroke="#d29922" stroke-width="2.5" marker-end="url(#arrY)"/>
  <path d="M660,250 C710,250 720,306 760,306" fill="none" stroke="#f85149" stroke-width="2.5" marker-end="url(#arrR)"/>

  <!-- ALLOW -->
  <rect x="762" y="120" width="178" height="62" rx="9" fill="#11271a" stroke="#3fb950" stroke-opacity="0.5"/>
  <text x="778" y="146" fill="#3fb950" font-size="15" font-weight="700">ALLOW</text>
  <text x="778" y="168" fill="#c9d1d9" font-size="12.5">clears → Stripe receipt</text>
  <!-- ESCALATE -->
  <rect x="762" y="198" width="178" height="62" rx="9" fill="#2a2310" stroke="#d29922" stroke-opacity="0.5"/>
  <text x="778" y="224" fill="#d29922" font-size="15" font-weight="700">ESCALATE</text>
  <text x="778" y="246" fill="#c9d1d9" font-size="12.5">approve in Telegram</text>
  <!-- DENY -->
  <rect x="762" y="276" width="178" height="62" rx="9" fill="#2a1414" stroke="#f85149" stroke-opacity="0.5"/>
  <text x="778" y="302" fill="#f85149" font-size="15" font-weight="700">DENY</text>
  <text x="778" y="324" fill="#c9d1d9" font-size="12.5">blocked · no receipt</text>

  <!-- ledger -->
  <line x1="500" y1="304" x2="500" y2="372" stroke="#8b949e" stroke-width="2" marker-end="url(#arr)"/>
  <rect x="40" y="378" width="880" height="74" rx="10" fill="#161b22" stroke="#30363d"/>
  <text x="64" y="406" fill="#ffffff" font-size="15" font-weight="700">Hash-chained, tamper-evident ledger</text>
  <text x="64" y="430" fill="#8b949e" font-size="13">every decision — ALLOW, ESCALATE, DENY — appended and chained. The whole run audits line by line.</text>

  <!-- proof spine -->
  <rect x="40" y="470" width="880" height="128" rx="10" fill="#0f1521" stroke="#30363d"/>
  <text x="64" y="500" fill="#bc8cff" font-size="14" font-weight="700">PROOF SPINE — one request ID, four surfaces</text>
  <text x="64" y="522" fill="#8b949e" font-size="12.5">No receipt = no money moved. The absence is the proof.</text>

  <g font-size="12.5">
    <rect x="64" y="540" width="170" height="40" rx="7" fill="#161b22" stroke="#30363d"/>
    <text x="76" y="558" fill="#8b949e" font-size="11">policy rule</text>
    <text x="76" y="574" fill="#c9d1d9" font-weight="600">why it cleared / blocked</text>

    <line x1="234" y1="560" x2="262" y2="560" stroke="#8b949e" stroke-width="1.5" marker-end="url(#arr)"/>
    <rect x="264" y="540" width="170" height="40" rx="7" fill="#161b22" stroke="#30363d"/>
    <text x="276" y="558" fill="#8b949e" font-size="11">ledger hash</text>
    <text x="276" y="574" fill="#c9d1d9" font-weight="600">tamper-evident chain</text>

    <line x1="434" y1="560" x2="462" y2="560" stroke="#8b949e" stroke-width="1.5" marker-end="url(#arr)"/>
    <rect x="464" y="540" width="170" height="40" rx="7" fill="#161b22" stroke="#30363d"/>
    <text x="476" y="558" fill="#8b949e" font-size="11">Stripe receipt</text>
    <text x="476" y="574" fill="#3fb950" font-weight="600">when money moved</text>

    <line x1="634" y1="560" x2="662" y2="560" stroke="#8b949e" stroke-width="1.5" marker-end="url(#arr)"/>
    <rect x="664" y="540" width="176" height="40" rx="7" fill="#161b22" stroke="#30363d"/>
    <text x="676" y="558" fill="#8b949e" font-size="11">sandbox event</text>
    <text x="676" y="574" fill="#c9d1d9" font-weight="600">where it ran</text>
  </g>
</svg>
